name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_PATH: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Lake Catch.app
  ARCHIVE_PATH: release/Lake-Catch-macos-arm64.zip

jobs:
  build-macos-arm64:
    name: Build Lake Catch for Apple Silicon
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace type checks
        run: pnpm check

      - name: Run MCP smoke tests
        run: pnpm --filter @lake/mcp-server test

      - name: Build the adhoc-signed macOS app
        run: pnpm build:desktop:arm64:app

      - name: Verify the bundled MCP server
        run: pnpm verify:mcp-bundle "$APP_PATH/Contents/Resources/mcp-server"

      - name: Verify the macOS app bundle
        shell: bash
        run: |
          set -euo pipefail

          test -x "$APP_PATH/Contents/MacOS/lake-catch"
          test -x "$APP_PATH/Contents/Resources/mcp-server/node"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP_PATH/Contents/Info.plist")" = "com.lake.catch"

          lipo "$APP_PATH/Contents/MacOS/lake-catch" -verify_arch arm64
          while IFS= read -r -d '' binary; do
            lipo "$binary" -verify_arch arm64
          done < <(find "$APP_PATH/Contents/Resources/mcp-server" -type f \( -name node -o -name '*.dylib' \) -print0)

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Package the app as a zip archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARCHIVE_PATH"
          unzip -t "$ARCHIVE_PATH"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lake-Catch-macos-arm64
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach zip to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ARCHIVE_PATH" --generate-notes --verify-tag
          fi
