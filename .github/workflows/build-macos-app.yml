name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build Lake Catch for Apple Silicon
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the adhoc-signed macOS app
        run: pnpm build:desktop:arm64:app

      - name: Verify the bundled MCP server
        run: >-
          pnpm verify:mcp-bundle
          apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Lake Catch.app/Contents/Resources/mcp-server

      - name: Package the app as a zip archive
        shell: bash
        run: |
          set -euo pipefail
          app_path="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Lake Catch.app"
          archive_path="release/Lake-Catch-macos-arm64.zip"

          test -d "$app_path"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$archive_path"
          unzip -l "$archive_path"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lake-Catch-macos-arm64
          path: release/Lake-Catch-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach zip to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/Lake-Catch-macos-arm64.zip --generate-notes --verify-tag
